name: Regenerate English dictionary

# Rebuilds en_wordlist.txt and en_bigrams.txt from their sources with
# tools/generate_assets.py: FrequencyWords (50k and full lists), SCOWL and the
# Tatoeba English sentences. The development environment cannot reach Tatoeba,
# so this is how the bigram table is recounted after the vocabulary changes.
#
# The result is pushed to the `assets/en-dictionary` branch (the two asset files
# and the log only), the same route train.yml uses for models: CI artifacts are
# not reachable from the development environment. Nothing here commits to the
# branch under review.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-tzp9ui]
    paths:
      - tools/generate_assets.py
      - .github/workflows/dictionary.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download SCOWL and the full FrequencyWords list
        run: |
          mkdir -p src
          curl -sSL -o src/scowl.tar.gz https://downloads.sourceforge.net/wordlist/scowl-2020.12.07.tar.gz
          tar xzf src/scowl.tar.gz -C src
          curl -sSL -o src/en_full.txt https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/en/en_full.txt

      - name: Generate
        run: |
          mkdir -p out
          python tools/generate_assets.py --lang en --out-dir out \
            --scowl-dir src/scowl-2020.12.07 --full-wordlist-file src/en_full.txt 2>&1 | tee out/generate.log
          diff <(cut -f1 app/src/main/assets/dictionaries/en_wordlist.txt | sort) <(cut -f1 out/en_wordlist.txt | sort) | head -200 | tee out/wordlist_vocab_diff.txt || true

      - name: Publish to the assets/en-dictionary branch
        run: |
          cd out
          git init -q -b assets/en-dictionary
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'English dictionary regenerated by .github/workflows/dictionary.yml from %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -qm "en dictionary from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets/en-dictionary
